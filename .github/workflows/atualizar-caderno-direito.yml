name: Atualizar Caderno de Direito

on:
  push:
    branches: [main]
    paths: ['.github/workflows/atualizar-caderno-direito.yml']

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar mudanças
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Caderno de Concurso','CADERNO DE DIREITO')
          s=s.replace('Caderno de Concurso Independente','Caderno de Direito')
          s=s.replace('backup-caderno-concurso-','backup-caderno-direito-')
          old='        <button class="btn" id="exportBtn">Exportar backup</button>\n        <button class="btn ghost" id="importBtn">Importar backup</button>'
          new='        <button class="btn" id="exportTxtBtn">Backup para leitura (.TXT)</button>\n        <button class="btn" id="exportBtn">Backup completo (.JSON)</button>\n        <button class="btn ghost" id="importBtn">Importar backup</button>'
          s=s.replace(old,new,1)
          marker='    async function importBackup(file)'
          func='''    function exportReadableBackup(){const clean=html=>{const el=document.createElement("div");el.innerHTML=html||"";el.querySelectorAll("br").forEach(x=>x.replaceWith("\\n"));el.querySelectorAll("p,div,li,h1,h2,h3,h4,h5,h6,tr").forEach(x=>x.append("\\n"));return(el.textContent||"").replace(/\\u00a0/g," ").replace(/[ \\t]+\\n/g,"\\n").replace(/\\n{3,}/g,"\\n\\n").trim()};const out=["CADERNO DE DIREITO",`Backup realizado em: ${new Date().toLocaleString("pt-BR")}`,"=".repeat(60),""];activeSubjects().forEach(subject=>{out.push(`MATÉRIA: ${subject.title||"Sem nome"}`,"=".repeat(60),"");const notes=items.filter(x=>x.type==="note"&&x.subjectId===subject.id&&!x.trashed).sort((a,b)=>a.createdAt-b.createdAt);notes.forEach(note=>out.push(`NOTA: ${label(note)}`,"",clean(note.content)||"(Nota vazia)","","-".repeat(60),""));out.push("")});const data="\\ufeff"+out.join("\\r\\n"),url=URL.createObjectURL(new Blob([data],{type:"text/plain;charset=utf-8"})),a=document.createElement("a");a.href=url;a.download=`caderno-de-direito-${new Date().toISOString().slice(0,10)}.txt`;a.click();URL.revokeObjectURL(url);notify("Backup para leitura exportado.")}\n'''
          if 'function exportReadableBackup()' not in s:
              s=s.replace(marker,func+marker,1)
          s=s.replace('$("exportBtn").onclick=exportBackup;','$("exportTxtBtn").onclick=exportReadableBackup;$("exportBtn").onclick=exportBackup;',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Publica CADERNO DE DIREITO e backup legível"
          git push
