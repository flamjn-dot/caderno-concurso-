<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Caderno de Concurso</title>
  <style>
    :root{--bg:#07111f;--panel:#0b1829;--panel2:#102137;--line:#1c3552;--text:#e8f0fb;--muted:#8ea3bc;--blue:#4f9cf9;--blue2:#1e64b6;--danger:#ff6b78;--gold:#f4bf54;--shadow:0 16px 40px #0007;--radius:16px}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);overflow:hidden}button,input,select{font:inherit}button{color:inherit}.hidden{display:none!important}
    .app{display:grid;grid-template-columns:280px minmax(0,1fr);height:100%}.sidebar{display:flex;flex-direction:column;min-width:0;background:#091625;border-right:1px solid var(--line)}
    .brand{display:flex;gap:12px;align-items:center;padding:20px 18px 16px;border-bottom:1px solid var(--line)}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#2678d9,#174d8a);font:700 22px Georgia,serif;box-shadow:0 8px 22px #0b5ba455}.brand strong{display:block;font:700 17px Georgia,serif}.brand small{color:var(--muted)}
    .side-scroll{flex:1;overflow:auto;padding:14px 10px}.side-label{display:flex;align-items:center;justify-content:space-between;padding:12px 9px 7px;color:#7089a6;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.side-link{display:flex;width:100%;align-items:center;gap:10px;border:0;border-radius:10px;background:transparent;padding:10px 11px;text-align:left;cursor:pointer}.side-link:hover,.side-link.active{background:#132a45}.side-link.active{color:#8bc0ff}.side-link span:first-child{width:22px;text-align:center}.side-link .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.subject-list{display:grid;gap:2px}.round-add{border:0;background:transparent;border-radius:8px;padding:2px 7px;cursor:pointer;color:#9fc9fa;font-size:20px}.round-add:hover{background:#18314f}
    .side-footer{padding:13px;border-top:1px solid var(--line);display:grid;gap:8px}.data-note{color:#748aa4;font-size:11px;text-align:center}.btn{border:1px solid var(--line);border-radius:10px;background:#10243c;padding:9px 13px;cursor:pointer;font-weight:700}.btn:hover{background:#173451;border-color:#2a527b}.btn.primary{background:#236fc7;border-color:#2e82e4}.btn.primary:hover{background:#2a7fde}.btn.ghost{background:transparent}.btn.danger{background:#4b1c27;border-color:#7d2b3b;color:#ffd9de}.btn.icon{display:grid;place-items:center;width:36px;height:36px;padding:0;font-size:18px}
    .workspace{display:flex;min-width:0;min-height:0;flex-direction:column}.topbar{height:68px;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--line);background:#0a1727dd;backdrop-filter:blur(10px)}.menu-btn{display:none}.crumb{min-width:0;flex:1}.crumb small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.crumb h1{margin:1px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 20px Georgia,serif}.search{position:relative;width:min(360px,35vw)}.search input{width:100%;height:40px;border:1px solid var(--line);border-radius:11px;background:#081321;color:var(--text);padding:0 13px 0 38px;outline:0}.search input:focus{border-color:#418bdc;box-shadow:0 0 0 3px #287ed42b}.search:before{content:"⌕";position:absolute;left:13px;top:5px;color:#8da5bf;font-size:22px}.content{flex:1;min-height:0;overflow:auto;padding:30px}.content-inner{max-width:1150px;margin:auto}.section-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:17px}.eyebrow{margin:0 0 4px;color:#7190b2;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.section-head h2{margin:0;font:700 27px Georgia,serif}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{position:relative;min-width:0;border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(145deg,#102138,#0c1a2c);box-shadow:0 8px 25px #0002;transition:.18s}.card:hover{border-color:#315d88;transform:translateY(-2px);box-shadow:var(--shadow)}.card-main{width:100%;min-height:126px;border:0;background:transparent;padding:19px;text-align:left;cursor:pointer}.card-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#173a61;color:#8ac0ff;font-size:20px}.card h3{margin:16px 45px 4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}.card p{display:-webkit-box;margin:0;color:var(--muted);overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical}.card-meta{margin-top:12px;color:#69819c;font-size:12px}.card-actions{position:absolute;right:10px;top:10px;display:flex;gap:3px}.mini{border:0;border-radius:8px;background:transparent;color:#8099b4;padding:7px 8px;cursor:pointer}.mini:hover{background:#19334f;color:#d9eaff}.mini.star.on{color:var(--gold)}
    .empty{max-width:480px;margin:10vh auto 0;padding:40px 25px;border:1px dashed #294867;border-radius:22px;background:#0c1929;text-align:center}.empty .big{font-size:34px}.empty h2{margin:12px 0 6px;font:700 25px Georgia,serif}.empty p{margin:0 0 22px;color:var(--muted)}
    .editor-wrap{flex:1;min-height:0;overflow:auto;padding:18px 24px 30px}.editor-paper{max-width:980px;min-height:100%;margin:auto;border:1px solid var(--line);border-radius:18px;background:#0d1b2d;box-shadow:var(--shadow);overflow:hidden}.editor-head{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}.title-input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);outline:0;font:700 25px Georgia,serif}.title-input::placeholder{color:#5f7590}.save-state{white-space:nowrap;color:#7690aa;font-size:12px}.toolbar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:4px;padding:8px 17px;border-bottom:1px solid var(--line);background:#0a1727f2}.tool{min-width:33px;height:33px;border:0;border-radius:7px;background:transparent;color:#a8bbcf;cursor:pointer}.tool:hover{background:#19334f;color:white}.tool strong{font-family:Georgia,serif}.divider{width:1px;height:25px;margin:4px 4px;background:var(--line)}.editor{min-height:62vh;padding:36px 50px;color:#dce8f6;font-size:17px;line-height:1.85;outline:0}.editor:empty:before{content:attr(data-placeholder);color:#5f7590}.editor h2{font:700 25px/1.35 Georgia,serif;color:#f0f6ff}.editor ul{padding-left:25px}.editor ol{padding-left:28px}.editor table{border-collapse:collapse;width:100%;margin:16px 0}.editor td{border:1px solid #35516e;padding:8px 10px;min-width:90px}.editor mark{background:#efd36a;color:#111827}
    .modal-backdrop{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:18px;background:#000a}.modal{width:min(440px,100%);border:1px solid #294969;border-radius:18px;background:#0d1c2f;padding:22px;box-shadow:var(--shadow)}.modal h2{margin:0 0 5px;font:700 22px Georgia,serif}.modal p{margin:0 0 18px;color:var(--muted)}.modal input,.modal select{width:100%;height:43px;border:1px solid var(--line);border-radius:10px;background:#071320;color:var(--text);padding:0 12px;outline:0}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.toast{position:fixed;right:20px;bottom:20px;z-index:80;max-width:350px;border:1px solid #31597f;border-radius:12px;background:#14304d;padding:12px 16px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.overlay{display:none}
    .auth-screen{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 15%,#11345a 0,transparent 35%),var(--bg)}.auth-card{width:min(430px,100%);border:1px solid var(--line);border-radius:24px;background:#0b192a;padding:30px;box-shadow:var(--shadow)}.auth-logo{display:grid;place-items:center;width:54px;height:54px;margin-bottom:20px;border-radius:16px;background:linear-gradient(145deg,#2678d9,#174d8a);font:700 28px Georgia,serif}.auth-card h1{margin:0;font:700 27px Georgia,serif}.auth-card>p{margin:8px 0 23px;color:var(--muted)}.auth-form{display:grid;gap:12px}.auth-form label{color:#9fb2c8;font-size:13px;font-weight:700}.auth-form input{width:100%;height:45px;margin-top:5px;border:1px solid var(--line);border-radius:11px;background:#071320;color:var(--text);padding:0 12px;outline:0}.auth-form input:focus{border-color:#418bdc;box-shadow:0 0 0 3px #287ed42b}.auth-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:8px}.auth-message{min-height:21px;margin:4px 0 0!important;color:#9fc9fa!important;font-size:13px}.account-email{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8ea3bc;font-size:12px;text-align:center}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:22px}.search{width:260px}}
    @media(max-width:700px){body{overflow:auto}.app{display:block;min-height:100%;height:auto}.sidebar{position:fixed;z-index:30;inset:0 auto 0 0;width:280px;transform:translateX(-102%);transition:.2s}.sidebar.open{transform:none}.overlay.open{display:block;position:fixed;z-index:25;inset:0;background:#0009}.workspace{min-height:100vh}.menu-btn{display:grid}.topbar{position:sticky;top:0;z-index:10;padding:0 12px}.search{width:42px}.search input{padding:0;color:transparent;cursor:pointer}.search:focus-within{position:absolute;left:58px;right:10px;width:auto}.search:focus-within input{padding-left:38px;color:var(--text);background:#081321}.top-action-text{display:none}.content{padding:20px 14px}.grid{grid-template-columns:1fr}.editor-wrap{padding:9px}.editor-head{padding:17px 15px}.title-input{font-size:21px}.editor{padding:27px 21px}.section-head h2{font-size:24px}}
  </style>
</head>
<body>
  <section class="auth-screen" id="authScreen">
    <div class="auth-card">
      <div class="auth-logo">C</div>
      <h1>Caderno de Concurso</h1>
      <p>Entre com seu e-mail para acessar as mesmas anotações no celular e no computador.</p>
      <form class="auth-form" id="authForm">
        <label>E-mail<input id="authEmail" type="email" autocomplete="email" required placeholder="seuemail@exemplo.com"></label>
        <label>Senha<input id="authPassword" type="password" autocomplete="current-password" required minlength="6" placeholder="Mínimo de 6 caracteres"></label>
        <div class="auth-actions"><button class="btn primary" type="submit">Entrar</button><button class="btn" type="button" id="createAccountBtn">Criar conta</button></div>
        <p class="auth-message" id="authMessage"></p>
      </form>
    </div>
  </section>

  <div class="app hidden" id="app">
    <aside class="sidebar" id="sidebar">
      <button class="brand" id="homeBtn" style="border-top:0;border-left:0;border-right:0;background:transparent;color:inherit;text-align:left;cursor:pointer;width:100%">
        <span class="brand-mark">C</span><span><strong>Caderno de Concurso</strong><small>Simples e independente</small></span>
      </button>
      <div class="side-scroll">
        <button class="side-link active" data-view="home"><span>▦</span><span class="label">Todas as matérias</span></button>
        <button class="side-link" data-view="favorites"><span>☆</span><span class="label">Notas favoritas</span></button>
        <button class="side-link" data-view="trash"><span>♲</span><span class="label">Lixeira</span></button>
        <div class="side-label"><span>Matérias</span><button class="round-add" id="sideAddSubject" title="Nova matéria">+</button></div>
        <div class="subject-list" id="subjectList"></div>
      </div>
      <div class="side-footer">
        <div class="account-email" id="accountEmail"></div>
        <button class="btn" id="exportBtn">Exportar backup</button>
        <button class="btn ghost" id="importBtn">Importar backup</button>
        <button class="btn ghost" id="logoutBtn">Sair da conta</button>
        <input class="hidden" id="importFile" type="file" accept="application/json,.json">
        <div class="data-note">Suas alterações são sincronizadas automaticamente.</div>
      </div>
    </aside>
    <div class="overlay" id="overlay"></div>

    <section class="workspace">
      <header class="topbar">
        <button class="btn icon ghost menu-btn" id="menuBtn" aria-label="Abrir menu">☰</button>
        <div class="crumb"><small id="crumbSmall">Caderno</small><h1 id="pageTitle">Suas matérias</h1></div>
        <div class="search"><input id="searchInput" placeholder="Pesquisar nas notas" aria-label="Pesquisar nas notas"></div>
        <button class="btn primary" id="primaryBtn"><span>＋</span> <span class="top-action-text">Nova matéria</span></button>
      </header>

      <main class="content" id="content"><div class="content-inner" id="contentInner"></div></main>

      <section class="editor-wrap hidden" id="editorView">
        <article class="editor-paper">
          <div class="editor-head">
            <button class="btn icon ghost" id="backBtn" title="Voltar">←</button>
            <input class="title-input" id="noteTitle" placeholder="Título opcional" maxlength="160">
            <span class="save-state" id="saveState">Salvo</span>
            <button class="btn icon ghost" id="favoriteBtn" title="Favoritar">☆</button>
            <button class="btn icon ghost" id="trashNoteBtn" title="Mover para a lixeira">♲</button>
          </div>
          <div class="toolbar" id="toolbar">
            <button class="tool" data-cmd="formatBlock" data-value="h2" title="Título"><strong>H2</strong></button><span class="divider"></span>
            <button class="tool" data-cmd="bold" title="Negrito"><b>B</b></button>
            <button class="tool" data-cmd="italic" title="Itálico"><i>I</i></button>
            <button class="tool" data-cmd="underline" title="Sublinhado"><u>U</u></button>
            <button class="tool" data-cmd="strikeThrough" title="Tachado"><s>S</s></button>
            <button class="tool" data-cmd="hiliteColor" data-value="#efd36a" title="Marca-texto">▰</button><span class="divider"></span>
            <button class="tool" data-cmd="insertUnorderedList" title="Lista">•≡</button>
            <button class="tool" data-cmd="insertOrderedList" title="Lista numerada">1≡</button>
            <button class="tool" data-cmd="justifyLeft" title="Alinhar à esquerda">≡</button>
            <button class="tool" data-cmd="justifyCenter" title="Centralizar">≣</button>
            <button class="tool" data-cmd="justifyRight" title="Alinhar à direita">≡</button>
            <button class="tool" id="tableBtn" title="Inserir tabela">▦</button>
          </div>
          <div class="editor" id="editor" contenteditable="true" data-placeholder="Comece a escrever sua anotação…"></div>
        </article>
      </section>
    </section>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true"><h2 id="modalTitle"></h2><p id="modalText"></p><input id="modalInput" maxlength="160"><div class="modal-actions"><button class="btn ghost" id="modalCancel">Cancelar</button><button class="btn primary" id="modalConfirm">Confirmar</button></div></div></div>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (()=>{
    "use strict";
    const SUPABASE_URL="https://oqdywlytsbcctrficcfm.supabase.co", SUPABASE_ANON_KEY="sb_publishable_SYLqoVg_7ScHcIJuGiTSrA_Mf8_jBOI";
    let items=[], view="home", subjectId=null, noteId=null, supa=null, user=null, subscription=null, saveTimer=null, syncTimer=null, modalAction=null, toastTimer=null;
    const $=id=>document.getElementById(id);

    function id(){return crypto.randomUUID?crypto.randomUUID():"10000000-1000-4000-8000-100000000000".replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16))}
    function esc(value){return String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
    function text(html){const node=document.createElement("div");node.innerHTML=html||"";return(node.textContent||"").trim()}
    function now(){return Date.now()}
    function label(note){return note.title?.trim()||`Nota ${note.number||1}`}
    function date(ts){return new Intl.DateTimeFormat("pt-BR",{day:"2-digit",month:"short",year:"numeric"}).format(ts)}
    function notify(message){clearTimeout(toastTimer);$("toast").textContent=message;$("toast").classList.add("show");toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2600)}

    function fromRow(row){return{id:row.id,type:row.type,subjectId:row.subject_id,title:row.title||"",content:row.content||"",number:row.note_number||0,favorite:!!row.favorite,trashed:!!row.trashed,createdAt:new Date(row.created_at).getTime(),updatedAt:new Date(row.updated_at).getTime()}}
    function toRow(item){return{id:item.id,user_id:user.id,type:item.type,subject_id:item.subjectId||null,title:item.title||"",content:item.content||"",note_number:item.number||0,favorite:!!item.favorite,trashed:!!item.trashed,created_at:new Date(item.createdAt||now()).toISOString(),updated_at:new Date(item.updatedAt||now()).toISOString()}}
    async function loadData(){const{data,error}=await supa.from("notebook_items").select("*").order("created_at",{ascending:true});if(error)throw error;items=(data||[]).map(fromRow)}
    async function persist(item){items=items.filter(x=>x.id!==item.id).concat(item);const{error}=await supa.from("notebook_items").upsert(toRow(item));if(error)throw error}
    async function removeMany(ids){const set=new Set(ids),{error}=await supa.from("notebook_items").delete().in("id",ids);if(error)throw error;items=items.filter(x=>!set.has(x.id))}
    async function replaceAll(next){const{error:deleteError}=await supa.from("notebook_items").delete().eq("user_id",user.id);if(deleteError)throw deleteError;if(next.length){const{error}=await supa.from("notebook_items").insert(next.map(item=>toRow(item)));if(error)throw error}items=next}
    function listenForChanges(){if(subscription)supa.removeChannel(subscription);subscription=supa.channel("caderno-"+user.id).on("postgres_changes",{event:"*",schema:"public",table:"notebook_items",filter:"user_id=eq."+user.id},()=>{clearTimeout(syncTimer);syncTimer=setTimeout(async()=>{await loadData();if(view!=="editor")render()},300)}).subscribe()}
    function showApp(){$("authScreen").classList.add("hidden");$("app").classList.remove("hidden");$("accountEmail").textContent=user.email||"";loadData().then(()=>{listenForChanges();render()}).catch(error=>notify("Não foi possível carregar o caderno: "+error.message))}
    function showAuth(message=""){$("app").classList.add("hidden");$("authScreen").classList.remove("hidden");$("authMessage").textContent=message}
    async function boot(){if(SUPABASE_URL.startsWith("__")){showAuth("A sincronização ainda está sendo configurada.");return}supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const{data}=await supa.auth.getSession();user=data.session?.user||null;if(user)showApp();else showAuth();supa.auth.onAuthStateChange((event,session)=>{user=session?.user||null;if(user&&event==="SIGNED_IN")showApp();if(!user&&event==="SIGNED_OUT")showAuth()})}
    async function signIn(email,password){$("authMessage").textContent="Entrando…";const{error}=await supa.auth.signInWithPassword({email,password});if(error)$("authMessage").textContent=error.message==="Invalid login credentials"?"E-mail ou senha incorretos.":error.message}
    async function signUp(email,password){$("authMessage").textContent="Criando conta…";const{data,error}=await supa.auth.signUp({email,password,options:{emailRedirectTo:"https://flamjn-dot.github.io/caderno-concurso-/"}});if(error){$("authMessage").textContent=error.message;return}if(!data.session)$("authMessage").textContent="Conta criada. Confira seu e-mail para confirmar o cadastro.";else $("authMessage").textContent="Conta criada com sucesso."}

    function activeSubjects(){return items.filter(x=>x.type==="subject"&&!x.trashed).sort((a,b)=>a.createdAt-b.createdAt)}
    function notesFor(sid,trashed=false){return items.filter(x=>x.type==="note"&&x.subjectId===sid&&!!x.trashed===trashed).sort((a,b)=>b.updatedAt-a.updatedAt)}
    function getSubject(){return items.find(x=>x.id===subjectId&&x.type==="subject")}
    function getNote(){return items.find(x=>x.id===noteId&&x.type==="note")}

    function setView(next,sid=null){view=next;subjectId=sid;noteId=null;$("editorView").classList.add("hidden");$("content").classList.remove("hidden");render();closeMenu()}
    function setEditor(note){view="editor";noteId=note.id;subjectId=note.subjectId;$("content").classList.add("hidden");$("editorView").classList.remove("hidden");$("noteTitle").value=note.title||"";$("editor").innerHTML=note.content||"";$("favoriteBtn").textContent=note.favorite?"★":"☆";$("favoriteBtn").style.color=note.favorite?"var(--gold)":"";$("saveState").textContent="Salvo";updateHeader();closeMenu();setTimeout(()=>$("editor").focus(),30)}
    function updateHeader(){const subject=getSubject();$("crumbSmall").textContent=view==="subject"||view==="editor"?(subject?.title||"Matéria"):"Caderno";$("pageTitle").textContent=view==="home"?"Suas matérias":view==="favorites"?"Notas favoritas":view==="trash"?"Lixeira":view==="search"?"Resultados da pesquisa":view==="subject"?(subject?.title||"Matéria"):label(getNote()||{});$("primaryBtn").classList.toggle("hidden",!["home","subject"].includes(view));$("primaryBtn").querySelector(".top-action-text").textContent=view==="subject"?"Nova nota":"Nova matéria"}
    function renderSidebar(){const list=$("subjectList");list.innerHTML=activeSubjects().map(subject=>`<button class="side-link ${subjectId===subject.id?"active":""}" data-subject="${subject.id}"><span>▰</span><span class="label">${esc(subject.title)}</span></button>`).join("");list.querySelectorAll("[data-subject]").forEach(btn=>btn.onclick=()=>setView("subject",btn.dataset.subject));document.querySelectorAll("[data-view]").forEach(btn=>btn.classList.toggle("active",btn.dataset.view===view))}
    function subjectCard(subject){const count=notesFor(subject.id).length;return`<article class="card"><button class="card-main" data-open-subject="${subject.id}"><span class="card-icon">▰</span><h3>${esc(subject.title)}</h3><p>${count} ${count===1?"nota":"notas"}</p><div class="card-meta">Criada em ${date(subject.createdAt)}</div></button><div class="card-actions"><button class="mini" data-rename-subject="${subject.id}" title="Renomear">✎</button><button class="mini" data-trash-subject="${subject.id}" title="Lixeira">♲</button></div></article>`}
    function noteCard(note,trash=false){const preview=text(note.content);return`<article class="card"><button class="card-main" data-open-note="${note.id}"><span class="card-icon">▤</span><h3>${esc(label(note))}</h3><p>${esc(preview||"Nota vazia — toque para começar a escrever.")}</p><div class="card-meta">Atualizada em ${date(note.updatedAt)}</div></button><div class="card-actions">${trash?`<button class="mini" data-restore-note="${note.id}" title="Restaurar">↶</button><button class="mini" data-delete-note="${note.id}" title="Excluir definitivamente">×</button>`:`<button class="mini star ${note.favorite?"on":""}" data-star-note="${note.id}" title="Favoritar">${note.favorite?"★":"☆"}</button><button class="mini" data-trash-note="${note.id}" title="Lixeira">♲</button>`}</div></article>`}
    function empty(icon,title,copy,button=""){return`<div class="empty"><div class="big">${icon}</div><h2>${title}</h2><p>${copy}</p>${button}</div>`}
    function render(){renderSidebar();updateHeader();const out=$("contentInner");if(view==="home"){const rows=activeSubjects();out.innerHTML=rows.length?`<div class="section-head"><div><p class="eyebrow">Organização</p><h2>Matérias</h2></div><button class="btn primary" data-add-subject>＋ Nova matéria</button></div><div class="grid">${rows.map(subjectCard).join("")}</div>`:empty("▦","Comece seu caderno","Crie uma matéria e depois adicione quantas notas quiser.",`<button class="btn primary" data-add-subject>＋ Criar primeira matéria</button>`)}else if(view==="subject"){const subject=getSubject(),notes=notesFor(subjectId);out.innerHTML=notes.length?`<div class="section-head"><div><p class="eyebrow">Galeria de anotações</p><h2>${esc(subject?.title||"")}</h2></div><button class="btn primary" data-add-note>＋ Nova nota</button></div><div class="grid">${notes.map(n=>noteCard(n)).join("")}</div>`:empty("▤","Nenhuma nota ainda","Toque em “Nova nota” e comece a escrever imediatamente.",`<button class="btn primary" data-add-note>＋ Nova nota</button>`)}else if(view==="favorites"){const notes=items.filter(x=>x.type==="note"&&!x.trashed&&x.favorite).sort((a,b)=>b.updatedAt-a.updatedAt);out.innerHTML=notes.length?`<div class="section-head"><div><p class="eyebrow">Acesso rápido</p><h2>Notas favoritas</h2></div></div><div class="grid">${notes.map(n=>noteCard(n)).join("")}</div>`:empty("☆","Nenhuma favorita","Use a estrela em uma nota para encontrá-la rapidamente aqui.")}else if(view==="trash"){renderTrash(out)}else if(view==="search"){renderSearch(out)}bindCards()}
    function renderTrash(out){const trashedSubjects=items.filter(x=>x.type==="subject"&&x.trashed),trashedSubjectIds=new Set(trashedSubjects.map(x=>x.id)),looseNotes=items.filter(x=>x.type==="note"&&x.trashed&&!trashedSubjectIds.has(x.subjectId));if(!trashedSubjects.length&&!looseNotes.length){out.innerHTML=empty("♲","Lixeira vazia","Matérias e notas excluídas aparecerão aqui.");return}out.innerHTML=`<div class="section-head"><div><p class="eyebrow">Itens excluídos</p><h2>Lixeira</h2></div></div>${trashedSubjects.length?`<p class="eyebrow">Matérias</p><div class="grid">${trashedSubjects.map(s=>`<article class="card"><div class="card-main"><span class="card-icon">▰</span><h3>${esc(s.title)}</h3><p>${items.filter(n=>n.type==="note"&&n.subjectId===s.id).length} notas dentro</p></div><div class="card-actions"><button class="mini" data-restore-subject="${s.id}" title="Restaurar">↶</button><button class="mini" data-delete-subject="${s.id}" title="Excluir definitivamente">×</button></div></article>`).join("")}</div>`:""}${looseNotes.length?`<p class="eyebrow" style="margin-top:28px">Notas</p><div class="grid">${looseNotes.map(n=>noteCard(n,true)).join("")}</div>`:""}`}
    function renderSearch(out){const term=$("searchInput").value.trim().toLocaleLowerCase("pt-BR");const notes=term?items.filter(x=>x.type==="note"&&!x.trashed&&(`${x.title||""} ${text(x.content)}`).toLocaleLowerCase("pt-BR").includes(term)).sort((a,b)=>b.updatedAt-a.updatedAt):[];out.innerHTML=notes.length?`<div class="section-head"><div><p class="eyebrow">${notes.length} resultado${notes.length===1?"":"s"}</p><h2>“${esc($("searchInput").value.trim())}”</h2></div></div><div class="grid">${notes.map(n=>noteCard(n)).join("")}</div>`:empty("⌕",term?"Nenhum resultado":"Digite para pesquisar",term?"Tente usar outra palavra.":"A pesquisa procura nos títulos e no conteúdo das notas.")}
    function bindCards(){document.querySelectorAll("[data-add-subject]").forEach(b=>b.onclick=createSubjectDialog);document.querySelectorAll("[data-add-note]").forEach(b=>b.onclick=createNote);document.querySelectorAll("[data-open-subject]").forEach(b=>b.onclick=()=>setView("subject",b.dataset.openSubject));document.querySelectorAll("[data-open-note]").forEach(b=>b.onclick=()=>{const n=items.find(x=>x.id===b.dataset.openNote);if(n&&!n.trashed)setEditor(n)});document.querySelectorAll("[data-rename-subject]").forEach(b=>b.onclick=()=>renameSubjectDialog(b.dataset.renameSubject));document.querySelectorAll("[data-trash-subject]").forEach(b=>b.onclick=()=>trashSubject(b.dataset.trashSubject));document.querySelectorAll("[data-star-note]").forEach(b=>b.onclick=()=>toggleStar(b.dataset.starNote));document.querySelectorAll("[data-trash-note]").forEach(b=>b.onclick=()=>trashNote(b.dataset.trashNote));document.querySelectorAll("[data-restore-note]").forEach(b=>b.onclick=()=>restoreNote(b.dataset.restoreNote));document.querySelectorAll("[data-delete-note]").forEach(b=>b.onclick=()=>confirmDeleteNote(b.dataset.deleteNote));document.querySelectorAll("[data-restore-subject]").forEach(b=>b.onclick=()=>restoreSubject(b.dataset.restoreSubject));document.querySelectorAll("[data-delete-subject]").forEach(b=>b.onclick=()=>confirmDeleteSubject(b.dataset.deleteSubject))}

    function showModal(title,copy,value,confirmLabel,action,danger=false){$("modalTitle").textContent=title;$("modalText").textContent=copy;$("modalInput").value=value||"";$("modalInput").classList.toggle("hidden",value===null);$("modalConfirm").textContent=confirmLabel;$("modalConfirm").classList.toggle("danger",danger);$("modalBackdrop").classList.remove("hidden");modalAction=action;if(value!==null)setTimeout(()=>$("modalInput").focus(),20)}
    function closeModal(){$("modalBackdrop").classList.add("hidden");modalAction=null}
    function createSubjectDialog(){showModal("Nova matéria","Digite o nome da matéria.","","Criar",async value=>{if(!value.trim())return;await persist({id:id(),type:"subject",title:value.trim(),createdAt:now(),updatedAt:now(),trashed:false});closeModal();render();notify("Matéria criada.")})}
    function renameSubjectDialog(sid){const s=items.find(x=>x.id===sid);if(!s)return;showModal("Renomear matéria","Digite o novo nome.",s.title,"Salvar",async value=>{if(!value.trim())return;s.title=value.trim();s.updatedAt=now();await persist(s);closeModal();render();notify("Nome atualizado.")})}
    async function createNote(){if(!subjectId)return;const nums=items.filter(x=>x.type==="note"&&x.subjectId===subjectId).map(x=>x.number||0),number=Math.max(0,...nums)+1,n={id:id(),type:"note",subjectId,title:"",content:"",number,createdAt:now(),updatedAt:now(),favorite:false,trashed:false};await persist(n);setEditor(n)}
    async function toggleStar(nid){const n=items.find(x=>x.id===nid);if(!n)return;n.favorite=!n.favorite;n.updatedAt=now();await persist(n);render();notify(n.favorite?"Nota adicionada às favoritas.":"Nota removida das favoritas.")}
    async function trashNote(nid){const n=items.find(x=>x.id===nid);if(!n)return;n.trashed=true;n.updatedAt=now();await persist(n);if(view==="editor")setView("subject",n.subjectId);else render();notify("Nota movida para a lixeira.")}
    async function restoreNote(nid){const n=items.find(x=>x.id===nid);if(!n)return;n.trashed=false;n.updatedAt=now();await persist(n);render();notify("Nota restaurada.")}
    async function trashSubject(sid){const s=items.find(x=>x.id===sid);if(!s)return;showModal("Mover matéria para a lixeira?","Todas as notas dentro dela também irão para a lixeira.",null,"Mover",async()=>{s.trashed=true;s.updatedAt=now();await persist(s);for(const n of items.filter(x=>x.type==="note"&&x.subjectId===sid)){n.trashed=true;n.updatedAt=now();await persist(n)}closeModal();setView("home");notify("Matéria movida para a lixeira.")},true)}
    async function restoreSubject(sid){const s=items.find(x=>x.id===sid);if(!s)return;s.trashed=false;s.updatedAt=now();await persist(s);for(const n of items.filter(x=>x.type==="note"&&x.subjectId===sid)){n.trashed=false;n.updatedAt=now();await persist(n)}render();notify("Matéria e notas restauradas.")}
    function confirmDeleteNote(nid){const n=items.find(x=>x.id===nid);showModal("Excluir definitivamente?",`A nota “${label(n||{})}” não poderá ser recuperada.`,null,"Excluir",async()=>{await removeMany([nid]);closeModal();render();notify("Nota excluída definitivamente.")},true)}
    function confirmDeleteSubject(sid){const s=items.find(x=>x.id===sid);showModal("Excluir matéria definitivamente?",`“${s?.title||"Esta matéria"}” e todas as notas dentro dela serão apagadas.`,null,"Excluir tudo",async()=>{await removeMany([sid,...items.filter(x=>x.type==="note"&&x.subjectId===sid).map(x=>x.id)]);closeModal();render();notify("Matéria excluída definitivamente.")},true)}

    function scheduleSave(){const n=getNote();if(!n)return;clearTimeout(saveTimer);$("saveState").textContent="Salvando…";saveTimer=setTimeout(async()=>{n.title=$("noteTitle").value.trim();n.content=$("editor").innerHTML;n.updatedAt=now();await persist(n);$("saveState").textContent="Salvo";updateHeader()},550)}
    function command(cmd,value=null){$("editor").focus();document.execCommand(cmd,false,value);scheduleSave()}
    function insertTable(){command("insertHTML","<table><tbody><tr><td>Texto</td><td>Texto</td></tr><tr><td>Texto</td><td>Texto</td></tr></tbody></table><p><br></p>")}
    function exportBackup(){const data=JSON.stringify({app:"Caderno de Concurso Independente",version:1,exportedAt:new Date().toISOString(),items},null,2),url=URL.createObjectURL(new Blob([data],{type:"application/json"})),a=document.createElement("a");a.href=url;a.download=`backup-caderno-concurso-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);notify("Backup exportado.")}
    async function importBackup(file){if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.items))throw new Error();showModal("Importar backup?","O conteúdo atual será substituído pelo conteúdo do arquivo.",null,"Importar",async()=>{await replaceAll(data.items.filter(x=>x&&x.id&&["subject","note"].includes(x.type)));closeModal();setView("home");notify("Backup importado.")},true)}catch{notify("Arquivo de backup inválido.")}finally{$("importFile").value=""}}
    function openMenu(){$("sidebar").classList.add("open");$("overlay").classList.add("open")}function closeMenu(){$("sidebar").classList.remove("open");$("overlay").classList.remove("open")}

    $("homeBtn").onclick=()=>setView("home");$("sideAddSubject").onclick=createSubjectDialog;document.querySelectorAll("[data-view]").forEach(btn=>btn.onclick=()=>setView(btn.dataset.view));$("primaryBtn").onclick=()=>view==="subject"?createNote():createSubjectDialog();$("searchInput").oninput=()=>{view="search";subjectId=null;render()};$("menuBtn").onclick=openMenu;$("overlay").onclick=closeMenu;$("backBtn").onclick=()=>setView("subject",subjectId);$("noteTitle").oninput=scheduleSave;$("editor").oninput=scheduleSave;$("favoriteBtn").onclick=()=>{const n=getNote();if(n)toggleStar(n.id).then(()=>setEditor(items.find(x=>x.id===n.id)))};$("trashNoteBtn").onclick=()=>{const n=getNote();if(n)trashNote(n.id)};$("toolbar").querySelectorAll("[data-cmd]").forEach(btn=>btn.onmousedown=e=>{e.preventDefault();command(btn.dataset.cmd,btn.dataset.value||null)});$("tableBtn").onmousedown=e=>{e.preventDefault();insertTable()};$("exportBtn").onclick=exportBackup;$("importBtn").onclick=()=>$("importFile").click();$("importFile").onchange=e=>importBackup(e.target.files[0]);$("modalCancel").onclick=closeModal;$("modalConfirm").onclick=()=>{if(modalAction)modalAction($("modalInput").value)};$("modalBackdrop").onclick=e=>{if(e.target===$("modalBackdrop"))closeModal()};document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("modalBackdrop").classList.contains("hidden")?closeMenu():closeModal()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"&&view==="editor"){e.preventDefault();scheduleSave()}});
    $("authForm").onsubmit=e=>{e.preventDefault();signIn($("authEmail").value.trim(),$("authPassword").value)};
    $("createAccountBtn").onclick=()=>signUp($("authEmail").value.trim(),$("authPassword").value);
    $("logoutBtn").onclick=async()=>{if(subscription)await supa.removeChannel(subscription);await supa.auth.signOut()};
    boot().catch(error=>showAuth("Não foi possível iniciar: "+error.message));
  })();
  </script>
</body>
</html>
